document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}\n:root{\n  /* Prisma palette */\n  --purple:#693efe;          /* Prisma Purple — accents only */\n  --purple-light:#ede8ff;    /* Lilac — soft accent surface */\n  --purple-dark:#4a23d6;     /* hover-darken */\n  --bone:#faf9f6;\n  --azure:#1a2b35;           /* Dark Azure */\n  --highlighter:#f9ff83;\n  /* Secondary palette (used semantically) */\n  --fern:#22c973;            /* \"teal\" / success */\n  --fern-light:#e1f5ee;\n  --fern-dark:#0e6b3c;\n  --poppy:#fc5e48;           /* \"coral\" / art group / danger highlight */\n  --poppy-light:#ffd3cb;     /* Peche */\n  --poppy-dark:#a82917;\n  --goldenrod:#f29820;       /* \"amber\" / warn */\n  --goldenrod-light:#faeed8;\n  --goldenrod-dark:#7a4a05;\n  --cranberry:#601212;       /* hard error text */\n  --cranberry-light:#fbe8e8;\n  --sky:#4398e3;\n  --arctic:#d8edff;\n  --plaster:#e3dfd6;\n  --wysteria:#ca9ed1;\n  /* Session indicators — saturated brand colors */\n  --s1:#1a2b35; --s1l:#d8edff; --s1d:#1a2b35;     /* Arctic surface, Azure border/text */\n  --s2:#22c973; --s2l:#22c973; --s2d:#202020;     /* Fern — black text on saturated fill */\n  --s3:#fc5e48; --s3l:#fc5e48; --s3d:#fff;        /* Poppy — white text on saturated fill */\n  /* Neutrals */\n  --ink:#202020;             /* primary text */\n  --muted:#595959;           /* secondary text */\n  --hint:#898989;             /* tertiary */\n  --line:#d3d3d3;\n  --line-soft:#eeeff3;\n  --surface:#ffffff;\n  --canvas:var(--bone);\n  --border:#d3d3d3;\n  --border-strong:#202020;\n  /* Compatibility aliases for inline styles in markup/JS */\n  --teal:var(--fern); --teal-light:var(--fern-light); --teal-dark:var(--fern-dark);\n  --coral:var(--poppy); --coral-light:var(--poppy-light); --coral-dark:var(--poppy-dark);\n  --amber:var(--goldenrod); --amber-light:var(--goldenrod-light); --amber-dark:var(--goldenrod-dark);\n  --red:#fc5e48; --red-light:var(--cranberry-light); --red-dark:var(--cranberry);\n  --gray-50:var(--bone); --gray-100:var(--plaster); --gray-600:var(--muted);\n  --text:var(--ink); --text-muted:var(--muted); --text-hint:var(--hint);\n  /* Radii — Prisma uses 10px cards, pill buttons */\n  --r:10px; --rl:10px; --pill:500px;\n  --font-sans:\"DM Sans\",ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif;\n  --font-mono:\"Roboto Mono\",ui-monospace,Menlo,Consolas,monospace;\n}\nbody{font-family:var(--font-sans);font-size:15px;color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}\n\n/* ── Header ────────────────────────────────────────────────────── */\n.header{background:#fff;border-bottom:1px solid var(--line);padding:18px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}\n.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-sans);font-size:0;}\n.logo img{height:26px;display:block;}\n.tagline{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:-0.02em;margin-left:14px;padding-left:14px;border-left:1px solid var(--line);}\n\n/* ── Layout ────────────────────────────────────────────────────── */\n.layout{display:flex;min-height:calc(100vh - 65px);}\n.sidebar{width:248px;min-width:248px;background:#fff;border-right:1px solid var(--line);padding:24px 0;position:sticky;top:65px;height:calc(100vh - 65px);overflow-y:auto;}\n.sl{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--hint);letter-spacing:0;text-transform:uppercase;padding:0 20px 8px;margin-top:18px;}\n.ni{display:flex;align-items:center;gap:12px;padding:10px 20px;font-size:14px;color:var(--ink);cursor:pointer;border-left:3px solid transparent;transition:color 140ms,background 140ms;}\n.ni:hover{color:var(--muted);}\n.ni.active{background:var(--purple);color:#fff;border-left-color:var(--purple);font-weight:500;}\n.nd{width:22px;height:22px;border-radius:var(--pill);background:var(--bone);color:var(--muted);font-family:var(--font-mono);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line);}\n.ni.active .nd{background:var(--purple);color:#fff;border-color:var(--purple);}\n.nb{margin-left:auto;background:var(--cranberry);color:#fff;font-family:var(--font-mono);font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--pill);}\n\n/* ── Main ──────────────────────────────────────────────────────── */\n.main{flex:1;padding:36px 44px;max-width:1240px;}\n.sec{display:none;}.sec.active{display:block;}\n.st{font-family:var(--font-sans);font-size:32px;font-weight:400;letter-spacing:-0.015em;line-height:1.2;margin-bottom:6px;}\n.sd{font-size:15px;color:var(--muted);line-height:1.5;margin-bottom:28px;max-width:720px;}\n\n/* ── Cards ─────────────────────────────────────────────────────── */\n.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px 28px;margin-bottom:18px;}\n.ct{font-size:16px;font-weight:500;margin-bottom:14px;letter-spacing:-0.005em;}\n\n/* ── Buttons ───────────────────────────────────────────────────── */\nbutton{padding:9px 18px;border-radius:var(--pill);font-family:var(--font-mono);font-size:12px;font-weight:400;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);transition:background 140ms,color 140ms,opacity 140ms;}\nbutton:hover{background:var(--ink);color:#fff;}\nbutton:disabled{opacity:0.4;cursor:not-allowed;}\nbutton:disabled:hover{background:transparent;color:var(--ink);}\n.bp{background:var(--purple);color:#fff;border-color:var(--purple);}\n.bp:hover{background:#fff;color:var(--purple);border-color:var(--purple);}\n.bs{background:var(--ink);color:#fff;border-color:var(--ink);}\n.bs:hover{background:#fff;color:var(--ink);}\n.bsm{padding:6px 14px;font-size:11px;}\n.bd{background:transparent;color:var(--ink);border-color:var(--ink);}\n.bd:hover{background:var(--ink);color:#fff;}\n.bf{width:100%;padding:16px;font-size:13px;}\n\n/* ── Forms ─────────────────────────────────────────────────────── */\nlabel{display:block;font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted);margin-bottom:6px;text-transform:none;letter-spacing:-0.02em;}\ninput[type=text],input[type=number],select,textarea{width:100%;padding:10px 12px;font-family:var(--font-sans);font-size:14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none;transition:border-color 140ms;}\ninput:focus,select:focus,textarea:focus{border-color:var(--purple);}\ntextarea{min-height:76px;resize:vertical;line-height:1.4;}\n\n/* ── Badges (rounded mono labels) ──────────────────────────────── */\n.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--pill);font-family:var(--font-mono);font-size:11px;font-weight:400;white-space:nowrap;letter-spacing:-0.02em;}\n.bp2{background:var(--purple);color:#fff;}\n.bt{background:var(--fern);color:var(--ink);}\n.ba{background:var(--goldenrod);color:var(--ink);}\n.br{background:var(--cranberry);color:#fff;}\n.bg{background:var(--arctic);color:var(--ink);}\n.bc{background:var(--azure);color:#fff;}\n\n/* ── Session badges & picker ───────────────────────────────────── */\n.s1-badge{background:var(--s1l);color:var(--ink);border:1px solid var(--s1);}\n.s2-badge{background:var(--s2l);color:var(--ink);border:1px solid var(--ink);}\n.s3-badge{background:var(--s3l);color:var(--ink);border:1px solid var(--ink);}\n.sess-picker{display:flex;gap:10px;margin-bottom:20px;}\n.sess-btn{padding:11px 28px;border-radius:var(--pill);font-family:var(--font-mono);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);transition:all 140ms;letter-spacing:-0.02em;}\n.sess-btn.s1.active{background:var(--s1l);color:var(--ink);border-color:var(--s1);}\n.sess-btn.s2.active{background:var(--s2l);color:var(--ink);border-color:var(--ink);}\n.sess-btn.s3.active{background:var(--s3l);color:var(--ink);border-color:var(--ink);}\n.sess-btn:not(.active):hover{color:var(--ink);border-color:var(--ink);}\n.sess-btn.s1:not(.active):hover{background:var(--s1l);}\n.sess-btn.s2:not(.active):hover{background:var(--s2l);}\n.sess-btn.s3:not(.active):hover{background:var(--s3l);}\n.sess-indicator{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--pill);font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:-0.02em;}\n.sess-indicator.s1{background:var(--s1l);color:var(--ink);}\n.sess-indicator.s2{background:var(--s2l);color:var(--ink);}\n.sess-indicator.s3{background:var(--s3l);color:var(--ink);}\n\n/* ── Stats grid & utility ──────────────────────────────────────── */\n.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}\n.sc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;}\n.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}\n.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}\n.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:14px;}\n.rf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}\n.es{color:var(--muted);font-size:14px;padding:32px 0;text-align:center;font-style:italic;}\n\n/* ── Inline alerts ─────────────────────────────────────────────── */\n.wb{background:var(--goldenrod);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--ink);margin-bottom:14px;border-left:3px solid var(--ink);}\n.ib{background:var(--azure);border-radius:8px;padding:12px 16px;font-size:13px;color:#fff;margin-bottom:14px;border-left:3px solid var(--ink);}\n.sb{background:var(--fern);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--ink);margin-bottom:14px;border-left:3px solid var(--ink);}\n\n/* ── Progress bars ─────────────────────────────────────────────── */\n.pw{background:var(--plaster);border-radius:var(--pill);height:6px;overflow:hidden;}\n.pf{height:6px;border-radius:var(--pill);background:var(--purple);transition:width 0.4s;}\n\n/* ── Data tables ───────────────────────────────────────────────── */\n.dt{width:100%;border-collapse:collapse;font-size:13px;}\n.dt th{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:-0.02em;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;background:var(--bone);}\n.dt td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}\n.dt tr:hover td{background:var(--bone);}\n\n/* ── Conflict cards & options ──────────────────────────────────── */\n.cc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;}\n.cf{border-left:3px solid var(--ink);padding:9px 14px;background:var(--goldenrod);color:var(--ink);margin-bottom:6px;font-size:13px;border-radius:0 4px 4px 0;}\n.cf.hard{border-left-color:var(--ink);background:var(--cranberry);color:#fff;}\n.cf.note{border-left-color:var(--ink);background:var(--arctic);color:var(--ink);}\n.oc{border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer;font-size:12px;min-width:150px;background:#fff;transition:border-color 140ms;}\n.oc:hover{border-color:var(--ink);}\n.oc.selected{border:2px solid var(--purple);padding:11px 15px;}\n.ro{border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color 140ms;}\n.ro:hover{border-color:var(--ink);}\n.ro.selected{border:2px solid var(--purple);padding:15px 19px;}\n\n/* ── Priority list ─────────────────────────────────────────────── */\n.pi{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}\n.pi:last-child{border-bottom:none;}\n/* Tier badges — each priority tier gets a distinct saturated brand color */\n.tier1{background:var(--purple);color:#fff;}\n.tier2{background:var(--azure);color:#fff;}\n.tier3{background:var(--fern);color:var(--ink);}\n.tier4{background:var(--goldenrod);color:var(--ink);}\n.tier5{background:var(--arctic);color:var(--ink);}\n.sgl{font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:0;margin:24px 0 12px;}\n\n/* ── Cohort grid (legacy) ──────────────────────────────────────── */\n.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px;}\n.chc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;}\n.chc.una{opacity:0.5;}\n\n/* ── Upload slots ──────────────────────────────────────────────── */\n.ug{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px;}\n.us{border:1px solid var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;cursor:pointer;background:#fff;color:var(--ink);transition:border-color 140ms;}\n.us:hover{border-color:var(--ink);}\n.us.loaded{border-color:var(--ink);background:#fff;color:var(--ink);}\n.us.error{border-color:var(--ink);background:var(--cranberry);color:#fff;}\n\n/* ── Name-mapping table ────────────────────────────────────────── */\n.nmt{width:100%;border-collapse:collapse;font-size:13px;}\n.nmt th{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:-0.02em;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;background:var(--bone);}\n.nmt td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;}\n.cb{height:4px;border-radius:var(--pill);background:var(--plaster);margin-top:6px;overflow:hidden;}\n.cf2{height:4px;border-radius:var(--pill);}\n.cm{color:var(--hint);font-style:italic;font-size:12px;}\n\n/* ── Peer chips ────────────────────────────────────────────────── */\n.peer-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--pill);font-family:var(--font-mono);font-size:11px;font-weight:400;margin:2px;letter-spacing:-0.02em;}\n.pc-ok{background:var(--fern);color:var(--ink);}\n.pc-fz{background:var(--goldenrod);color:var(--ink);}\n.pc-no{background:var(--cranberry);color:#fff;}\n.rn{background:#ede8ff22;}\n\n/* ── Schedule tables ───────────────────────────────────────────── */\n.sched-table{width:100%;border-collapse:collapse;font-size:13px;}\n.sched-table th{background:var(--bone);padding:9px 12px;text-align:left;font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--muted);border-bottom:1px solid var(--line);letter-spacing:-0.02em;}\n.sched-table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}\n.sched-table tr:last-child td{border-bottom:none;}\n\n/* ── Header student-count badge — convert to mono pill ─────────── */\n#student-count-badge{font-family:var(--font-mono);font-size:11px;letter-spacing:-0.02em;}\n\n/* ── Optgroup + select polish ──────────────────────────────────── */\noptgroup{font-family:var(--font-sans);font-style:normal;font-weight:500;}\n\n/* Selection highlight uses the brand yellow */\n::selection{background:var(--highlighter);color:var(--ink);}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<div class=\"header\">\n  <div class=\"rf\">\n    <a href=\"#\" class=\"logo\" aria-label=\"Prisma\"><img src=\"70c951c6-71ec-4109-b6f5-9767e6a40d91\" alt=\"Prisma\"><\u002Fa>\n    <span class=\"tagline\">Cohort placement tool &nbsp;·&nbsp; 26–27<\u002Fspan>\n    <span id=\"sess-header-badge\" style=\"margin-left:10px;\"><\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"rf\">\n    <span class=\"badge bg\" id=\"student-count-badge\">No data<\u002Fspan>\n    <button class=\"bsm bs\" onclick=\"exportCSV()\">↓ Export<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"layout\">\n  <nav class=\"sidebar\">\n    <div class=\"sl\">Session<\u002Fdiv>\n    <div style=\"padding:8px 16px;\">\n      <div style=\"font-size:11px;color:var(--text-muted);margin-bottom:6px;\">Placing for session:<\u002Fdiv>\n      <div style=\"display:flex;gap:6px;\">\n        <button class=\"bsm sess-btn s1 active\" id=\"sbtn-1\" onclick=\"setSession(1)\">S1<\u002Fbutton>\n        <button class=\"bsm sess-btn s2\" id=\"sbtn-2\" onclick=\"setSession(2)\">S2<\u002Fbutton>\n        <button class=\"bsm sess-btn s3\" id=\"sbtn-3\" onclick=\"setSession(3)\">S3<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sl\">Setup<\u002Fdiv>\n    <div class=\"ni active\" onclick=\"showSec('upload')\" id=\"nav-upload\"><div class=\"nd\">1<\u002Fdiv>Data upload<\u002Fdiv>\n    <div class=\"ni\" onclick=\"showSec('namemap')\" id=\"nav-namemap\"><div class=\"nd\">2<\u002Fdiv>Name mapping<span class=\"nb\" id=\"namemap-badge\" style=\"display:none\">0<\u002Fspan><\u002Fdiv>\n    <div class=\"ni\" onclick=\"showSec('schedule')\" id=\"nav-schedule\"><div class=\"nd\">3<\u002Fdiv>Schedule &amp; classes<\u002Fdiv>\n    <div class=\"ni\" onclick=\"showSec('run')\" id=\"nav-run\"><div class=\"nd\">4<\u002Fdiv>Run placement<\u002Fdiv>\n    <div class=\"sl\">Review<\u002Fdiv>\n    <div class=\"ni\" onclick=\"showSec('conflicts')\" id=\"nav-conflicts\"><div class=\"nd\">5<\u002Fdiv>Conflict queue<span class=\"nb\" id=\"conflict-badge\" style=\"display:none\">0<\u002Fspan><\u002Fdiv>\n    <div class=\"ni\" onclick=\"showSec('results')\" id=\"nav-results\"><div class=\"nd\">6<\u002Fdiv>All placements<\u002Fdiv>\n    <div class=\"sl\">Tools<\u002Fdiv>\n    <div class=\"ni\" onclick=\"showSec('manual')\" id=\"nav-manual\"><div class=\"nd\">7<\u002Fdiv>Manual entry<\u002Fdiv>\n  <\u002Fnav>\n\n  <main class=\"main\">\n\n    <!-- 1. UPLOAD -->\n    <div class=\"sec active\" id=\"sec-upload\">\n      <div class=\"st\">Data upload<\u002Fdiv>\n      <div class=\"sd\">Upload your three source files. The survey name is read from column C only — no other columns are used for identity.<\u002Fdiv>\n      <div class=\"ug\">\n        <div class=\"us\" id=\"slot-hubspot\" onclick=\"document.getElementById('file-hubspot').click()\">\n          <input type=\"file\" id=\"file-hubspot\" accept=\".csv,.xlsx,.xls\" style=\"display:none\" onchange=\"handleFile('hubspot',this)\">\n          <img src=\"418dd9df-ecdd-4272-bf93-caec043a9777\" alt=\"HubSpot\" style=\"height:28px;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto;\">\n          <div style=\"font-size:13px;font-weight:600;margin-bottom:4px;\">HubSpot Deal View<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--text-muted);\">Full legal name · Grade · Coach · Cohort · Math level · Session<\u002Fdiv>\n          <div style=\"font-size:11px;margin-top:6px;font-weight:500;\" id=\"status-hubspot\">Click to upload<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"us\" id=\"slot-master\" onclick=\"document.getElementById('file-master').click()\">\n          <input type=\"file\" id=\"file-master\" accept=\".csv,.xlsx,.xls\" style=\"display:none\" onchange=\"handleFile('master',this)\">\n          <div style=\"font-size:28px;margin-bottom:8px\">📋<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;margin-bottom:4px;\">Master Data Tracker<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--text-muted);\">Preferred name · Session 1/2/3 courses · Math class · AP · FL · Timezone<\u002Fdiv>\n          <div style=\"font-size:11px;margin-top:6px;font-weight:500;\" id=\"status-master\">Click to upload<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"us\" id=\"slot-survey\" onclick=\"document.getElementById('file-survey').click()\">\n          <input type=\"file\" id=\"file-survey\" accept=\".csv,.xlsx,.xls\" style=\"display:none\" onchange=\"handleFile('survey',this)\">\n          <div style=\"font-size:28px;margin-bottom:8px\">📋<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;margin-bottom:4px;\">Club Survey <span class=\"badge bg\" style=\"font-size:10px;\">Optional<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--text-muted);\">Column C = learner name. Peer preference column used for social scoring only.<\u002Fdiv>\n          <div style=\"font-size:11px;margin-top:6px;font-weight:500;\" id=\"status-survey\">Click to upload<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"upload-summary\" style=\"display:none\"><\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"ct\">Load sample data<\u002Fdiv>\n        <p style=\"font-size:13px;color:var(--text-muted);margin-bottom:12px;\">16 students with nickname variations, math classes, AP courses, and session assignments across S1–S3.<\u002Fp>\n        <button onclick=\"loadSampleData()\">Load sample data<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2. NAME MAPPING -->\n    <div class=\"sec\" id=\"sec-namemap\">\n      <div class=\"st\">Name mapping<\u002Fdiv>\n      <div class=\"sd\">HubSpot legal name ↔ Master Tracker preferred name only. Survey column C names are resolved against this roster after merge — not here.<\u002Fdiv>\n      <div id=\"namemap-content\"><div class=\"es\">Upload HubSpot and Master Tracker first.<\u002Fdiv><\u002Fdiv>\n      <div id=\"namemap-actions\" style=\"display:none;margin-top:16px;\">\n        <button class=\"bp\" onclick=\"confirmNameMap()\">Confirm all &amp; continue →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3. SCHEDULE & CLASSES -->\n    <div class=\"sec\" id=\"sec-schedule\">\n      <div class=\"st\">Schedule &amp; classes<\u002Fdiv>\n      <div class=\"sd\">Math classes and AP sections are pre-loaded from the 26–27 schedule. Edit times or add sections as needed. These drive placement priority 2 and 3.<\u002Fdiv>\n\n      <div class=\"card\" style=\"background:var(--s1l);border-color:var(--ink);\">\n        <div class=\"ct\" style=\"color:var(--ink);\">Priority order reminder<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--ink);line-height:1.8;\">\n          <strong>1.<\u002Fstrong> Session (S1 / S2 / S3) — cohort group is determined by the session course<br>\n          <strong>2.<\u002Fstrong> Math class time slot — must not conflict with standup or workshop<br>\n          <strong>3.<\u002Fstrong> AP class — time slot compatibility<br>\n          <strong>4.<\u002Fstrong> Timezone band<br>\n          <strong>5.<\u002Fstrong> Coach continuity · Peer preferences · Interests\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"sgl\">Math classes — from 26–27 schedule<\u002Fdiv>\n      <div class=\"card\">\n        <table class=\"sched-table\" id=\"math-table\">\n          <thead><tr><th>Class<\u002Fth><th>Teacher<\u002Fth><th>Days<\u002Fth><th>Time (ET)<\u002Fth><th>Cohort bands OK<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody id=\"math-tbody\"><\u002Ftbody>\n        <\u002Ftable>\n        <button style=\"margin-top:10px;\" onclick=\"addMathClass()\">+ Add math class<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"sgl\">AP sections — from 26–27 schedule<\u002Fdiv>\n      <div class=\"card\">\n        <table class=\"sched-table\" id=\"ap-table\">\n          <thead><tr><th>Course<\u002Fth><th>Teacher<\u002Fth><th>Days<\u002Fth><th>Time (ET)<\u002Fth><th>Cohort bands OK<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody id=\"ap-tbody\"><\u002Ftbody>\n        <\u002Ftable>\n        <button style=\"margin-top:10px;\" onclick=\"addAPClass()\">+ Add AP section<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"sgl\">Foreign language sections<\u002Fdiv>\n      <div class=\"card\">\n        <table class=\"sched-table\">\n          <thead><tr><th>Course<\u002Fth><th>Days<\u002Fth><th>Time (ET)<\u002Fth><th>Cohort bands OK<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody id=\"fl-tbody\"><\u002Ftbody>\n        <\u002Ftable>\n        <button style=\"margin-top:10px;\" onclick=\"addFLClass()\">+ Add FL section<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 4. RUN -->\n    <div class=\"sec\" id=\"sec-run\">\n      <div class=\"st\">Run placement engine<\u002Fdiv>\n      <div class=\"sd\">Placing for the session selected in the sidebar. Session course → cohort group. Math + AP slot compatibility → cohort. Timezone → specific cohort within group.<\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"ct\">Active session<\u002Fdiv>\n        <div class=\"sess-picker\">\n          <button class=\"sess-btn s1\" id=\"rbtn-1\" onclick=\"setSession(1)\">Session 1<\u002Fbutton>\n          <button class=\"sess-btn s2\" id=\"rbtn-2\" onclick=\"setSession(2)\">Session 2<\u002Fbutton>\n          <button class=\"sess-btn s3\" id=\"rbtn-3\" onclick=\"setSession(3)\">Session 3<\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"run-session-desc\" style=\"font-size:13px;color:var(--text-muted);\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\"><div class=\"ct\">Peer matching<\u002Fdiv>\n        <div style=\"font-size:13px;color:var(--text-muted);margin-bottom:10px;\">Survey respondent = column C name, matched against roster. Peer names from the free-text field parsed and scored after merge.<\u002Fdiv>\n        <div id=\"peer-preview\"><div class=\"es\" style=\"padding:8px 0;\">Upload survey and run name mapping first.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\"><div class=\"ct\">Priority rules<\u002Fdiv><div id=\"priority-list\"><\u002Fdiv><\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"ct\">Capacity<\u002Fdiv>\n        <div class=\"fg2\" style=\"max-width:340px;\">\n          <div><label>Min per cohort<\u002Flabel><input type=\"number\" id=\"cap-min\" value=\"15\" min=\"1\" max=\"30\"><\u002Fdiv>\n          <div><label>Max per cohort<\u002Flabel><input type=\"number\" id=\"cap-max\" value=\"25\" min=\"1\" max=\"30\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"bp bf\" id=\"run-btn\" onclick=\"runPlacement()\">Run placement engine<\u002Fbutton>\n      <div id=\"run-progress\" style=\"display:none;margin-top:16px;\">\n        <div style=\"font-size:13px;color:var(--text-muted);margin-bottom:8px;\" id=\"run-status\">Processing...<\u002Fdiv>\n        <div class=\"pw\" style=\"height:8px;border-radius:4px;\"><div class=\"pf\" id=\"run-bar\" style=\"width:0%;height:8px;border-radius:4px;\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 5. CONFLICTS -->\n    <div class=\"sec\" id=\"sec-conflicts\">\n      <div class=\"st\">Conflict queue<\u002Fdiv>\n      <div class=\"sd\">Students where hard or soft constraints couldn't be met. Choose an option, add a note, confirm.<\u002Fdiv>\n      <div id=\"conflict-list\"><div class=\"es\">Run the placement engine to see conflicts.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 6. RESULTS -->\n    <div class=\"sec\" id=\"sec-results\">\n      <div class=\"st\">All placements<\u002Fdiv>\n      <div class=\"sd\">Review, filter, edit, export.<\u002Fdiv>\n      <div class=\"sg\" id=\"results-stats\"><\u002Fdiv>\n      <div class=\"rf\" style=\"margin-bottom:16px;gap:8px;flex-wrap:wrap;\">\n        <input type=\"text\" id=\"search-q\" placeholder=\"Search name or ID…\" oninput=\"filterResults()\" style=\"max-width:200px;\">\n        <select id=\"filter-cohort\" onchange=\"filterResults()\" style=\"max-width:120px;\"><option value=\"\">All cohorts<\u002Foption><\u002Fselect>\n        <select id=\"filter-group\" onchange=\"filterResults()\" style=\"max-width:120px;\"><option value=\"\">All groups<\u002Foption><option value=\"art\">Art<\u002Foption><option value=\"econ\">Econ<\u002Foption><option value=\"envi\">Envi Sci<\u002Foption><option value=\"ao\">A&amp;O<\u002Foption><\u002Fselect>\n        <select id=\"filter-status\" onchange=\"filterResults()\" style=\"max-width:120px;\"><option value=\"\">All statuses<\u002Foption><option value=\"placed\">Placed<\u002Foption><option value=\"conflict\">Conflict<\u002Foption><option value=\"manual\">Manual<\u002Foption><\u002Fselect>\n        <button class=\"bsm bs\" onclick=\"exportCSV()\">↓ Export CSV<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto;\">\n        <table class=\"dt\">\n          <thead><tr><th>Student<\u002Fth><th>Gr<\u002Fth><th>Sess<\u002Fth><th>Group<\u002Fth><th>Cohort<\u002Fth><th>TZ<\u002Fth><th>Coach<\u002Fth><th>Standup<\u002Fth><th>Math<\u002Fth><th>AP<\u002Fth><th>Status<\u002Fth><th>Score<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody id=\"results-tbody\"><tr><td colspan=\"13\" class=\"es\">Run the placement engine to see results.<\u002Ftd><\u002Ftr><\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 7. MANUAL -->\n    <div class=\"sec\" id=\"sec-manual\">\n      <div class=\"st\">Manual entry<\u002Fdiv>\n      <div class=\"sd\">Place a new enrollment or re-place a learner.<\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"ct\">Learner details<\u002Fdiv>\n        <div class=\"fg3\">\n          <div><label>First name<\u002Flabel><input type=\"text\" id=\"m-fn\"><\u002Fdiv>\n          <div><label>Last name<\u002Flabel><input type=\"text\" id=\"m-ln\"><\u002Fdiv>\n          <div><label>Student ID<\u002Flabel><input type=\"text\" id=\"m-id\" placeholder=\"PS-0000\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fg4\">\n          <div><label>Grade (next year)<\u002Flabel><select id=\"m-gr\"><option value=\"\">Select<\u002Foption><option>9<\u002Foption><option>10<\u002Foption><option>11<\u002Foption><option>12<\u002Foption><\u002Fselect><\u002Fdiv>\n          <div><label>Time zone<\u002Flabel><select id=\"m-tz\"><option value=\"\">Select<\u002Foption><optgroup label=\"Americas\"><option>ET<\u002Foption><option>CT<\u002Foption><option>MT<\u002Foption><option>PT<\u002Foption><option>AKT<\u002Foption><option>HT<\u002Foption><\u002Foptgroup><optgroup label=\"Europe\"><option>GMT<\u002Foption><option>BST<\u002Foption><option>CET<\u002Foption><option>EET<\u002Foption><\u002Foptgroup><optgroup label=\"Asia/Oceania\"><option>IST<\u002Foption><option>SGT<\u002Foption><option>JST<\u002Foption><option>AEST<\u002Foption><option>NZST<\u002Foption><option>PHT<\u002Foption><option>HKT<\u002Foption><\u002Foptgroup><option>Other<\u002Foption><\u002Fselect><\u002Fdiv>\n          <div><label>Session<\u002Flabel><select id=\"m-sess\"><option value=\"\">Select<\u002Foption><option value=\"1\">Session 1<\u002Foption><option value=\"2\">Session 2<\u002Foption><option value=\"3\">Session 3<\u002Foption><\u002Fselect><\u002Fdiv>\n          <div><label>Session course<\u002Flabel><select id=\"m-s1\"><option value=\"\">Select<\u002Foption><option value=\"art\">Beyond the Frame (Art)<\u002Foption><option value=\"econ\">Build a Business (Econ)<\u002Foption><option value=\"envi\">Secrets of the Biosphere (Envi)<\u002Foption><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fg3\">\n          <div><label>Math class<\u002Flabel><select id=\"m-math\"><option value=\"\">None / unknown<\u002Foption><\u002Fselect><\u002Fdiv>\n          <div><label>AP course<\u002Flabel><select id=\"m-ap\"><option value=\"\">None<\u002Foption><\u002Fselect><\u002Fdiv>\n          <div><label>Foreign language<\u002Flabel><select id=\"m-fl\"><option value=\"\">None<\u002Foption><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fg3\">\n          <div><label>Previous cohort<\u002Flabel><input type=\"text\" id=\"m-prev\" placeholder=\"e.g. S\"><\u002Fdiv>\n          <div><label>Previous coach<\u002Flabel><input type=\"text\" id=\"m-coach\" placeholder=\"e.g. James\"><\u002Fdiv>\n          <div><label>Reason<\u002Flabel><select id=\"m-why\"><option value=\"new\">New enrollment<\u002Foption><option value=\"switch\">Cohort switch<\u002Foption><option value=\"other\">Other<\u002Foption><\u002Fselect><\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"bp\" onclick=\"runManual()\" \"10:15 AM\", \"1:30 pm\"\n  if(!t)return null;\n  const m=String(t).match(/(\\d+):(\\d+)\\s*(am|pm)/i);if(!m)return null;\n  let h=parseInt(m[1]),mn=parseInt(m[2]),mer=m[3].toLowerCase();\n  if(mer==='pm'&&h!==12)h+=12;if(mer==='am'&&h===12)h=0;\n  return h*60+mn;\n}\n\nfunction classConflicts(classSlot, band){\n  // classSlot: {startMins, endMins}\n  const blocks=BAND_BLOCKS[band]||[];\n  return blocks.some(b=>classSlot.startMins<b.end&&classSlot.endMins>b.start);\n}\n\n// ── MATH CLASSES (pre-loaded from 26–27 schedule) ──────────────────────────\n// Parsed from uploaded CSV: days/times extracted, \"OK bands\" = which standup bands don't conflict\nlet mathClasses=[\n  {id:'alg1a',name:'Algebra 1A',teacher:'Shaquita',days:'Mon/Tue/Wed/Thu',time:'1:30 – 2:15pm ET',startMins:810,endMins:855,okBands:['morning-EST']},\n  {id:'alg1b',name:'Algebra 1B',teacher:'Shaquita',days:'Tue/Thu',time:'12:30 – 1:15pm ET',startMins:750,endMins:795,okBands:['morning-EST','afternoon-EST']},\n  {id:'alg1mw',name:'Algebra 1 (M/W)',teacher:'Shaquita',days:'Mon/Wed',time:'10:15 – 11:00am ET',startMins:615,endMins:660,okBands:['midday-EST','afternoon-EST']},\n  {id:'alg1th',name:'Algebra 1 (T/Th)',teacher:'Shaquita',days:'Tue/Thu',time:'3:00 – 3:45pm ET',startMins:900,endMins:945,okBands:['morning-EST','midday-EST']},\n  {id:'geo',name:'Geometry',teacher:'New',days:'Mon/Tue/Wed/Thu',time:'10:15 – 11:00am ET',startMins:615,endMins:660,okBands:['midday-EST','afternoon-EST']},\n  {id:'geo2',name:'Geometry (alt)',teacher:'New',days:'Mon/Wed',time:'1:30 – 2:15pm ET',startMins:810,endMins:855,okBands:['morning-EST']},\n  {id:'alg2',name:'Algebra 2',teacher:'Jim',days:'Mon/Tue/Wed/Thu',time:'10:15 – 11:00am ET',startMins:615,endMins:660,okBands:['midday-EST','afternoon-EST']},\n  {id:'alg2alt',name:'Algebra 2 (alt)',teacher:'Jim',days:'Mon/Wed/Thu',time:'1:30 – 2:15pm ET',startMins:810,endMins:855,okBands:['morning-EST']},\n  {id:'precalc',name:'Pre-Calculus',teacher:'Todd',days:'Mon/Wed/Thu',ti
