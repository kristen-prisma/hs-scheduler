t:'Env. Science',standup:'1:30–2pm ET',workshop:'3–4pm ET',tzBand:'afternoon-EST',coach:'New Coach',capacity:25},\n];\n\nconst PRIORITIES=[\n  {tier:1,label:'Session (S1/S2/S3) — course determines cohort group',locked:true},\n  {tier:2,label:'Math class time slot — cohort band must not block math',locked:true},\n  {tier:2,label:'AP class time slot — cohort band must not block AP',locked:true},\n  {tier:3,label:'A&O timezone → A&O cohort (overrides course group)',locked:true},\n  {tier:3,label:'Timezone band within group',locked:true},\n  {tier:3,label:'European learners → morning ET first',locked:true},\n  {tier:4,label:'Grade ≠ typical for course → note added, proceeds',locked:true},\n  {tier:4,label:'Peer preferences — place with named friends when possible',locked:false},\n  {tier:4,label:'Mentor coach continuity',locked:false},\n  {tier:4,label:'Interest & club alignment',locked:false},\n  {tier:5,label:'Even distribution within timezone band',locked:false},\n  {tier:5,label:'Coach load balancing',locked:false},\n];\n\n// ── STATE ──────────────────────────────────────────────────────────────────────\nlet rawFiles={hubspot:null,survey:null,master:null};\nlet nameMapPairs=[];\nlet students=[];\nlet peerLinks=[];\nlet placements=[],conflicts=[],selectedManual=null;\nlet activeSession=1;\n\n// ── SESSION SELECTOR ───────────────────────────────────────────────────────────\nfunction setSession(n){\n  activeSession=n;\n  [1,2,3].forEach(i=>{\n    const sb=document.getElementById('sbtn-'+i);\n    const rb=document.getElementById('rbtn-'+i);\n    if(sb)sb.classList.toggle('active',i===n);\n    if(rb)rb.classList.toggle('active',i===n);\n  });\n  const labels={1:'Session 1 — Beyond the Frame · Build a Business · Secrets of the Biosphere',2:'Session 2 — courses TBD for your cohort',3:'Session 3 — courses TBD for your cohort'};\n  const el=document.getElementById('run-session-desc');if(el)el.textContent=labels[n]||'';\n  const badge=document.getElementById('sess-header-badge');\n  if(badge)badge.innerHTML=`<span class=\"sess-indicator s${n}\">S${n}<\u002Fspan>`;\n}\n\n// ── HELPERS ────────────────────────────────────────────────────────────────────\nconst isAO=tz=>AO_TZS.includes(tz);\nconst isEU=tz=>EU_TZS.includes(tz);\nconst getBands=tz=>isAO(tz)?['ao']:TZ_ROUTING[tz]||['morning-EST','midday-EST','afternoon-EST'];\nconst cohortCount=id=>placements.filter(p=>p.cohort===id).length;\nconst getC=id=>COHORTS.find(c=>c.id===id);\nconst gColor=g=>({art:'var(--coral)',econ:'var(--teal)',envi:'var(--purple)',ao:'var(--teal)'}[g]||'var(--purple)');\nconst gBadge=g=>({art:'bc',econ:'bt',envi:'bp2',ao:'bt'}[g]||'bg');\nconst gLabel=g=>({art:'Art',econ:'Econ',envi:'Envi Sci',ao:'A&O'}[g]||g);\nconst normN=n=>String(n||'').toLowerCase().trim().replace(/[^a-z\\s]/g,'').replace(/\\s+/g,' ').trim();\nfunction lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);return d[m][n];}\nfunction nameSim(a,b){if(!a||!b)return 0;if(a===b)return 1;const ta=a.split(' '),tb=b.split(' '),la=ta[ta.length-1],lb=tb[tb.length-1],fa=ta[0],fb=tb[0];const lm=la&&lb&&la===lb,fs=fa&&fb?1-lev(fa,fb)/Math.max(fa.length,fb.length):0,px=fa&&fb&&(fa.startsWith(fb)||fb.startsWith(fa));if(lm&&(fs>0.6||px))return 0.9;if(lm&&fs>0.3)return 0.75;return 1-lev(a,b)/Math.max(a.length,b.length);}\nfunction normTZ(r){if(!r)return'';const s=String(r).toUpperCase().trim().replace(/\\s+/g,'');if(s.includes('EASTERN')||s==='EST'||s==='EDT'||s==='ET')return'ET';if(s.includes('CENTRAL')||s==='CST'||s==='CDT'||s==='CT')return'CT';if(s.includes('MOUNTAIN')||s==='MST'||s==='MDT'||s==='MT')return'MT';if(s.includes('PACIFIC')||s==='PST'||s==='PDT'||s==='PT')return'PT';if(s.includes('ALASKA'))return'AKT';if(s.includes('HAWAII'))return'HT';if(s==='GMT'||s==='UTC')return'GMT';if(s==='BST')return'BST';if(s==='CET')return'CET';if(s==='EET')return'EET';if(s==='IST'||s.includes('INDIA'))return'IST';if(s==='SGT'||s.includes('SINGAPORE'))return'SGT';if(s==='JST'||s.includes('JAPAN'))return'JST';if(s==='AEST'||s==='AEDT'||s.includes('AUSTRALIA'))return'AEST';if(s==='NZST'||s==='NZDT')return'NZST';if(s==='PHT'||s.includes('PHILIPPINE'))return'PHT';if(s==='HKT'||s.includes('HONG KONG'))return'HKT';return r.trim();}\nfunction findCol(row,cands){const keys=Object.keys(row);for(const c of cands){const nc=c.toLowerCase().replace(/[^a-z0-9]/g,'');const m=keys.find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,'')===nc||k.toLowerCase().replace(/[^a-z0-9]/g,'').includes(nc)||nc.includes(k.toLowerCase().replace(/[^a-z0-9]/g,'')));if(m&&row[m]!==undefined&&row[m]!=='')return String(row[m]).trim();}return'';}\nfunction parseGrade(v){if(!v)return null;const n=parseInt(String(v).replace(/[^0-9]/g,''));if(n>=9&&n<=12)return n;const s=String(v).toLowerCase();if(s.includes('fresh'))return 9;if(s.includes('soph'))return 10;if(s.includes('jun'))return 11;if(s.includes('sen'))return 12;return null;}\nconst fN=f=>String(f||'').trim().split(/\\s+/)[0]||'';\nconst lN=f=>{const p=String(f||'').trim().split(/\\s+/);return p.length>1?p.slice(1).join(' '):''};\nfunction parsePeerNames(raw){if(!raw)return[];return raw.split(/[,;&\\n]+|(?:\\s+and\\s+)/i).map(s=>s.trim().replace(/^[\\d\\.\\-\\*]+\\s*/,'')).filter(s=>s.length>1&&!/^(and|or|also)$/i.test(s));}\nfunction resolveNameToStudent(token,roster){const nt=normN(token);if(!nt||nt.length<2)return null;let best=null,bs=0;roster.forEach(s=>{const score=Math.max(nameSim(nt,normN(s.preferred_name)),nameSim(nt,normN(s.first_name+' '+s.last_name)));if(score>bs){bs=score;best=s;}});if(bs<0.45)return null;return{student:best,conf:bs};}\n\n// Resolve a math/AP class name to a class object\nfunction resolveClass(name, list){\n  if(!name)return null;\n  const n=normN(name);\n  return list.find(c=>normN(c.name).includes(n.substring(0,6))||n.includes(normN(c.name).substring(0,6)))||null;\n}\n\n// ── FILE I/O ───────────────────────────────────────────────────────────────────\nfunction readFileAsRows(file){return new Promise((res,rej)=>{const r=new FileReader();if(file.name.match(/\\.xlsx?$/i)){r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});res(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}));}catch(err){rej(err);}};r.readAsArrayBuffer(file);}else{r.onload=e=>{try{const lines=e.target.result.trim().split('\\n'),h=pcsv(lines[0]);res(lines.slice(1).filter(l=>l.trim()).map(line=>{const v=pcsv(line),o={};h.forEach((hh,i)=>o[hh]=(v[i]||'').trim());return o;}));}catch(err){rej(err);}};r.readAsText(file);}});}\nfunction pcsv(line){const r=[];let c='',q=false;for(let i=0;i<line.length;i++){if(line[i]==='\"')q=!q;else if(line[i]===','&&!q){r.push(c.trim());c='';}else c+=line[i];}r.push(c.trim());return r;}\n\nasync function handleFile(slot,input){const file=input.files[0];if(!file)return;document.getElementById('slot-'+slot).className='us';document.getElementById('status-'+slot).textContent='Reading…';try{const rows=await readFileAsRows(file);rawFiles[slot]={rows,name:file.name};document.getElementById('slot-'+slot).className='us loaded';document.getElementById('status-'+slot).textContent='✓ '+rows.length+' rows · '+file.name;checkUploaded();}catch(err){document.getElementById('slot-'+slot).className='us error';document.getElementById('status-'+slot).textContent='Error: '+err.message;}}\n\nfunction checkUploaded(){\n  const hs=!!rawFiles.hubspot,mt=!!rawFiles.master;\n  const sum=document.getElementById('upload-summary');sum.style.display='block';\n  if(hs&&mt){buildNameMap();sum.innerHTML=`<div class=\"sb\">&#10003; Core files loaded.${rawFiles.survey?' Survey also loaded — column C will be used for learner name.':''} Proceed to Name mapping.<\u002Fdiv><button class=\"bp\" style=\"margin-top:8px;\" onclick=\"showSec('namemap')\">Name mapping &#8594;<\u002Fbutton>`;}\n  else{sum.innerHTML='<div class=\"ib\">Upload both HubSpot and Master Tracker to enable matching. Survey is optional.<\u002Fdiv>';}\n}\n\n// ── NAME MAPPING ───────────────────────────────────────────────────────────────\nfunction buildNameMap(){\n  const hsNames=rawFiles.hubspot.rows.map(r=>findCol(r,['Child full name','child full name','full name','name'])).filter(Boolean);\n  const mtNames=rawFiles.master.rows.map(r=>findCol(r,['Preferred Name','preferred name','name'])).filter(Boolean);\n  nameMapPairs=hsNames.map(legal=>{\n    const nl=normN(legal);let best=null,bs=0;\n    mtNames.forEach(mn=>{const s=nameSim(nl,normN(mn));if(s>bs){bs=s;best=mn;}});\n    const needs=bs<0.75;\n    return{legal,mtSug:best,mtConf:bs,mtName:bs>=0.75?best:null,needsReview:needs,confirmed:!needs,skip:false};\n  });\n  renderNameMap();updateNMBadge();\n}\nfunction updateNMBadge(){const n=nameMapPairs.filter(p=>p.needsReview&&!p.confirmed&&!p.skip).length;const b=document.getElementById('namemap-badge');if(n){b.textContent=n;b.style.display='inline';}else b.style.display='none';}\nfunction renderNameMap(){\n  const el=document.getElementById('namemap-content');\n  if(!nameMapPairs.length){el.innerHTML='<div class=\"es\">Upload HubSpot and Master Tracker first.<\u002Fdiv>';document.getElementById('namemap-actions').style.display='none';return;}\n  const pending=nameMapPairs.filter(p=>p.needsReview&&!p.skip),auto=nameMapPairs.filter(p=>!p.needsReview),skipped=nameMapPairs.filter(p=>p.skip);\n  let html='';\n  if(pending.length){html+=`<div class=\"card\" style=\"border-color:var(--amber);\"><div class=\"ct\" style=\"color:var(--ink);\">&#9888; ${pending.length} uncertain match${pending.length>1?'es':''}<\u002Fdiv><p style=\"font-size:13px;color:var(--text-muted);margin-bottom:14px;\">These legal names (HubSpot) couldn't be confidently matched to a preferred name (Master Tracker). Correct if needed, then Confirm or Skip.<\u002Fp><table class=\"nmt\"><thead><tr><th>HubSpot — legal name<\u002Fth><th>Master Tracker — preferred name<\u002Fth><th>Conf<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead><tbody>${pending.map(p=>{const i=nameMapPairs.indexOf(p);return`<tr><td><strong>${p.legal}<\u002Fstrong><\u002Ftd><td>${p.mtSug?`<div>${p.mtSug}<\u002Fdiv><div class=\"cb\"><div class=\"cf2\" style=\"width:${Math.round(p.mtConf*100)}%;background:${p.mtConf>=0.75?'var(--teal)':p.mtConf>=0.5?'var(--amber)':'var(--red)'};\"><\u002Fdiv><\u002Fdiv><input type=\"text\" id=\"mo-${i}\" value=\"${p.mtSug}\" style=\"margin-top:6px;font-size:12px;padding:4px 8px;\">`:'<span class=\"cm\">Not found<\u002Fspan><input type=\"text\" id=\"mo-${i}\" placeholder=\"Type preferred name\" style=\"margin-top:6px;font-size:12px;padding:4px 8px;\">'}<\u002Ftd><td style=\"font-size:12px;\">${p.mtConf?Math.round(p.mtConf*100)+'%':'—'}<\u002Ftd><td style=\"white-space:nowrap;\"><button class=\"bsm bp\" onclick=\"confirmPair(${i})\" style=\"margin-bottom:4px;width:80px;display:block;\">Confirm<\u002Fbutton><button class=\"bsm bd\" onclick=\"skipPair(${i})\" style=\"width:80px;display:block;\">Skip<\u002Fbutton><\u002Ftd><\u002Ftr>`;}).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv>`;}\n  if(auto.length){html+=`<div class=\"card\"><div class=\"rf\" style=\"justify-content:space-between;margin-bottom:10px;\"><div class=\"ct\" style=\"margin-bottom:0;\">&#10003; ${auto.length} auto-matched<\u002Fdiv><button class=\"bsm\" onclick=\"var e=document.getElementById('al');e.style.display=e.style.display==='none'?'block':'none';\">Show/hide<\u002Fbutton><\u002Fdiv><div id=\"al\" style=\"display:none;\"><table class=\"nmt\"><thead><tr><th>HubSpot legal<\u002Fth><th>Master Tracker preferred<\u002Fth><th>Conf<\u002Fth><\u002Ftr><\u002Fthead><tbody>${auto.map(p=>`<tr><td>${p.legal}<\u002Ftd><td>${p.mtName||'<span class=\"cm\">—<\u002Fspan>'}<\u002Ftd><td>${p.mtName?Math.round(p.mtConf*100)+'%':'—'}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable><\u002Fdiv><\u002Fdiv>`;}\n  if(skipped.length)html+=`<div class=\"ib\">&#8505; ${skipped.length} skipped — HubSpot data only.<\u002Fdiv>`;\n  el.innerHTML=html;document.getElementById('namemap-actions').style.display='block';\n}\nfunction confirmPair(i){const p=nameMapPairs[i];const mo=document.getElementById('mo-'+i);if(mo)p.mtName=mo.value.trim()||p.mtSug;p.confirmed=true;p.needsReview=false;renderNameMap();updateNMBadge();}\nfunction skipPair(i){nameMapPairs[i].skip=true;renderNameMap();updateNMBadge();}\nfunction confirmNameMap(){mergeAllData();buildSurveyLinks();renderClassSelects();showSec('schedule');}\n\n// ── MERGE ROSTER ───────────────────────────────────────────────────────────────\nfunction mergeAllData(){\n  students=[];\n  nameMapPairs.filter(p=>!p.skip).forEach((p,i)=>{\n    const hs=rawFiles.hubspot.rows.find(r=>normN(findCol(r,['Child full name','child full name','full name','name']))===normN(p.legal))||{};\n    const mt=p.mtName?rawFiles.master.rows.find(r=>normN(findCol(r,['Preferred Name','preferred name','name']))===normN(p.mtName))||{}:{};\n    const sess=parseInt(findCol(mt,['Session','session number','sess']))||parseInt(findCol(hs,['Session','session number','sess']))||activeSession;\n    const sessKey='session'+activeSession+'_course';\n    const s1c=findCol(mt,['Session 1 Course','session 1','s1 course']);\n    const s2c=findCol(mt,['Session 2 Course','session 2','s2 course']);\n    const s3c=findCol(mt,['Session 3 Course','session 3','s3 course']);\n    const activeCourse=[s1c,s2c,s3c][activeSession-1]||s1c;\n    students.push({\n      student_id:'PS-'+(1000+i),\n      first_name:fN(p.legal),last_name:lN(p.legal),preferred_name:p.mtName||fN(p.legal),\n      grade_level:String(parseGrade(findCol(mt,['Grade Level','grade level','grade']))||parseGrade(findCol(hs,['Grade level','grade level','grade']))||''),\n      time_zone:normTZ(findCol(mt,['Time Zone','timezone','time zone']))||normTZ(findCol(hs,['Time Zone','timezone','time zone'])),\n      session_number:String(sess),\n      session1_course:s1c,session2_course:s2c,session3_course:s3c,\n      active_course:activeCourse,\n      math_class:findCol(mt,['Math Class','math class','math level','math group'])||findCol(hs,['Math Group','math group','math']),\n      ap_course:findCol(mt,['AP Course','ap course','ap'])||findCol(hs,['AP Course','ap']),\n      foreign_language:findCol(mt,['FL Course','fl course','m/wfl course','foreign language course','foreign language']),\n      previous_cohort:findCol(hs,['Cohort','cohort'])||findCol(mt,['25-26 Cohort']),\n      previous_mentor_coach:findCol(mt,['Mentor Coach Cohort'])||findCol(hs,['Mentor Coach','mentor coach','coach']),\n      next_cohort:findCol(mt,['25-26 Cohort','26-27 Cohort','cohort 25-26','cohort 26-27']),\n      next_coach:findCol(mt,['25-26 Mentor Coach','26-27 Mentor Coach','mentor coach 25-26','mentor coach 26-27']),\n      interests:findCol(hs,['Personality and interests','interests']),\n    });\n  });\n  document.getElementById('student-count-badge').textContent=students.length+' students loaded';\n}\n\n// ── SURVEY PEER LINKING ────────────────────────────────────────────────────────\n// Column C (index 2) = learner name. Peer column found by keyword.\nfunction buildSurveyLinks(){\n  peerLinks=[];\n  if(!rawFiles.survey)return;\n  rawFiles.survey.rows.forEach(row=>{\n    const vals=Object.values(row);\n    // Column C = index 2\n    const respName=vals[2]?String(vals[2]).trim():'';\n    if(!respName||respName.length<2)return;\n    const respMatch=resolveNameToStudent(respName,students);\n    if(!respMatch||respMatch.conf<0.45)return;\n    // Find peer column by key\n    const keys=Object.keys(row);\n    const peerKey=keys.find(k=>/(hang|prismarian|peer|friend|cohort with|list.*3)/i.test(k));\n    if(!peerKey)return;\n    const peerRaw=row[peerKey];\n    if(!peerRaw)return;\n    const tokens=parsePeerNames(String(peerRaw));\n    const chips=tokens.map(tok=>{const m=resolveNameToStudent(tok,students);if(!m)return{name:tok,studentId:null,conf:0};return{name:tok,studentId:m.student.student_id,conf:m.conf};}).filter(c=>c.name.length>1);\n    if(chips.length)peerLinks.push({respondentId:respMatch.student.student_id,respName:respMatch.student.preferred_name,rawPeerText:String(peerRaw),chips});\n  });\n  renderPeerPreview();\n}\n\nfunction renderPeerPreview(){\n  const el=document.getElementById('peer-preview');\n  if(!el)return;\n  if(!peerLinks.length){el.innerHTML=rawFiles.survey?'<div class=\"wb\">Survey loaded but no peer preferences found. Ensure the peer column header contains \"hang\", \"prismarian\", or \"peers\".<\u002Fdiv>':'<div style=\"font-size:13px;color:var(--text-muted);\">No survey loaded — social scoring disabled.<\u002Fdiv>';return;}\n  const ok=peerLinks.reduce((a,l)=>a+l.chips.filter(c=>c.conf>=0.75).length,0),fz=peerLinks.reduce((a,l)=>a+l.chips.filter(c=>c.conf>=0.45&&c.conf<0.75).length,0),no=peerLinks.reduce((a,l)=>a+l.chips.filter(c=>c.conf<0.45).length,0);\n  el.innerHTML=`<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;\"><span class=\"peer-chip pc-ok\">&#10003; ${ok} resolved<\u002Fspan><span class=\"peer-chip pc-fz\">~ ${fz} fuzzy<\u002Fspan><span class=\"peer-chip pc-no\">✗ ${no} unresolved<\u002Fspan><\u002Fdiv><table class=\"nmt\"><thead><tr><th>Respondent<\u002Fth><th>Listed peers<\u002Fth><\u002Ftr><\u002Fthead><tbody>${peerLinks.map(l=>`<tr><td><strong>${l.respName}<\u002Fstrong><\u002Ftd><td>${l.chips.map(c=>`<span class=\"peer-chip ${c.conf>=0.75?'pc-ok':c.conf>=0.45?'pc-fz':'pc-no'}\" title=\"${c.conf>=0.45?'→ '+(students.find(s=>s.student_id===c.studentId)?.preferred_name||c.name):c.name+' unresolved'}\">${c.name}${c.conf>=0.75?' ✓':c.conf>=0.45?' ~':''}<\u002Fspan>`).join(' ')}<\u002Ftd><\u002Ftr>`).join('')}<\u002Ftbody><\u002Ftable>`;\n}\n\nfunction getPeerIds(studentId){const link=peerLinks.find(l=>l.respondentId===studentId);if(!link)return[];return link.chips.filter(c=>c.conf>=0.45&&c.studentId).map(c=>c.studentId);}\n\n// ── SCHEDULE RENDER ────────────────────────────────────────────────────────────\nfunction renderClassTable(tbodyId,list,editFn,removeFn){\n  const tb=document.getElementById(tbodyId);if(!tb)return;\n  if(!list.length){tb.innerHTML='<tr><td colspan=\"6\" class=\"es\" style=\"padding:12px 0;\">No entries yet.<\u002Ftd><\u002Ftr>';return;}\n  tb.innerHTML=list.map((c,i)=>`<tr><td><strong>${c.name}<\u002Fstrong><\u002Ftd><td style=\"color:var(--text-muted);\">${c.teacher||''}<\u002Ftd><td style=\"color:var(--text-muted);\">${c.days}<\u002Ftd><td style=\"color:var(--text-muted);\">${c.time}<\u002Ftd><td>${(c.okBands||[]).map(b=>{const k=b.replace('-EST','');return `<span class=\"badge\" style=\"font-size:10px;margin:1px;background:#1a2b35;color:#fff;border:0;\">${k}<\u002Fspan>`;}).join('')}<\u002Ftd><td><button class=\"bsm bd\" onclick=\"${removeFn}(${i})\">×<\u002Fbutton><\u002Ftd><\u002Ftr>`).join('');\n}\nfunction renderSchedule(){renderClassTable('math-tbody',mathClasses,'','removeMath');renderClassTable('ap-tbody',apClasses,'','removeAP');renderClassTable('fl-tbody',flClasses,'','removeFL');}\nfunction removeMath(i){mathClasses.splice(i,1);renderSchedule();}\nfunction removeAP(i){apClasses.splice(i,1);renderSchedule();}\nfunction removeFL(i){flClasses.splice(i,1);renderSchedule();}\nfunction addMathClass(){const n=prompt('Class name (e.g. Calculus):');if(!n)return;const t=prompt('Time (e.g. 2:00 – 2:45pm ET):','');const days=prompt('Days (e.g. Mon/Wed):','');mathClasses.push({id:'custom'+Date.now(),name:n,teacher:'TBD',days:days||'TBD',time:t||'TBD',startMins:0,endMins:0,okBands:['morning-EST','midday-EST','afternoon-EST']});renderSchedule();}\nfunction addAPClass(){const n=prompt('AP course name:');if(!n)return;const t=prompt('Time:','');const days=prompt('Days:','');apClasses.push({id:'apcustom'+Date.now(),name:n,teacher:'TBD',days:days||'TBD',time:t||'TBD',startMins:0,endMins:0,okBands:['morning-EST','midday-EST','afternoon-EST']});renderSchedule();}\nfunction addFLClass(){const n=prompt('FL course name:');if(!n)return;const t=prompt('Time:','');const days=prompt('Days:','');flClasses.push({id:'flcustom'+Date.now(),name:n,days:days||'TBD',time:t||'TBD',startMins:0,endMins:0,okBands:['morning-EST','midday-EST','afternoon-EST']});renderSchedule();}\n\nfunction renderClassSelects(){\n  const mSel=document.getElementById('m-math');const apSel=document.getElementById('m-ap');const flSel=document.getElementById('m-fl');\n  if(mSel){mSel.innerHTML='<option value=\"\">None / unknown<\u002Foption>'+mathClasses.map(c=>`<option value=\"${c.id}\">${c.name} (${c.days}, ${c.time})<\u002Foption>`).join('');}\n  if(apSel){apSel.innerHTML='<option value=\"\">None<\u002Foption>'+apClasses.map(c=>`<option value=\"${c.id}\">${c.name}<\u002Foption>`).join('');}\n  if(flSel){flSel.innerHTML='<option value=\"\">None<\u002Foption>'+flClasses.map(c=>`<option value=\"${c.id}\">${c.name}<\u002Foption>`).join('');}\n}\n\n// ── PRIORITY RENDER ────────────────────────────────────────────────────────────\nfunction renderPriorities(){document.getElementById('priority-list').innerHTML=PRIORITIES.map((p,i)=>`<div class=\"pi\"><span style=\"font-size:11px;min-width:18px;color:var(--text-hint);\">${i+1}<\u002Fspan><span class=\"badge tier${p.tier}\">T${p.tier}<\u002Fspan><span style=\"flex:1\">${p.label}<\u002Fspan>${p.locked?'<span style=\"font-size:11px;color:var(--text-hint);\">locked<\u002Fspan>':''}<\u002Fdiv>`).join('');}\n\n// ── PLACEMENT ENGINE ───────────────────────────────────────────────────────────\nfunction getCG(c){if(!c)return null;const s=c.toLowerCase();if(s.includes('art')||s.includes('beyond')||s.includes('frame'))return'art';if(s.includes('business')||s.includes('econ')||s.includes('build'))return'econ';if(s.includes('biosphere')||s.includes('environ')||s.includes('secret')||s.includes('env'))return'envi';return null;}\n\nfunction getBandConflicts(s){\n  // Returns bands that are BLOCKED by math or AP class\n  const blocked=new Set();\n  const mathCls=resolveClass(s.math_class,mathClasses);\n  const apCls=resolveClass(s.ap_course,apClasses);\n  ['morning-EST','midday-EST','afternoon-EST'].forEach(band=>{\n    if(mathCls&&mathCls.startMins&&classConflicts(mathCls,band))blocked.add(band);\n    if(apCls&&apCls.startMins&&classConflicts(apCls,band))blocked.add(band);\n  });\n  return blocked;\n}\n\nfunction scoreOneCohort(s,c,bands,alreadyPlaced,blockedBands){\n  let sc=50;\n  // Priority 2/3: math/AP compatibility — big bonus for non-conflicting bands\n  if(!blockedBands.has(c.tzBand))sc+=30;else sc-=40; // heavy penalty if conflicts\n  // Priority 4: timezone band preference\n  const bi=bands.indexOf(c.tzBand);\n  if(bi===0)sc+=20;else if(bi===1)sc+=10;else if(bi===2)sc+=5;\n  // Priority 5: continuity\n  if(s.next_cohort&&c.id===s.next_cohort.trim().toUpperCase())sc+=18;\n  if(s.next_coach&&c.coach===s.next_coach)sc+=12;\n  if(s.previous_cohort&&c.id===s.previous_cohort)sc+=7;\n  if(s.previous_mentor_coach&&c.coach===s.previous_mentor_coach)sc+=8;\n  // Peer overlap\n  const peerIds=getPeerIds(s.student_id);\n  sc+=Math.min(peerIds.filter(pid=>alreadyPlaced.some(p=>p.cohort===c.id&&p.student_id===pid)).length*5,10);\n  return Math.min(Math.max(Math.round(sc),0),100);\n}\n\nfunction runPlacement(){\n  if(!students.length){alert('Complete data upload and name mapping first, or load sample data.');return;}\n  const btn=document.getElementById('run-btn');btn.disabled=true;\n  document.getElementById('run-progress').style.display='block';\n  const steps=[[10,'Checking session course assignments…'],[25,'Routing A&O learners…'],[40,'Checking math class time conflicts…'],[55,'Checking AP class time conflicts…'],[70,'Applying timezone bands…'],[85,'Scoring peer preferences & coach continuity…'],[100,'Building conflict queue…']];\n  let si=0;const iv=setInterval(()=>{if(si<steps.length){document.getElementById('run-bar').style.width=steps[si][0]+'%';document.getElementById('run-status').textContent=steps[si][1];si++;}else{clearInterval(iv);doPlacement();btn.disabled=false;document.getElementById('run-status').textContent='✓ Done — '+students.length+' students processed.';}},380);\n}\n\nfunction doPlacement(){\n  placements=[];conflicts=[];const counts={};COHORTS.forEach(c=>counts[c.id]=0);\n  students.forEach(s=>{\n    const grade=parseInt(s.grade_level)||9,ng=Math.min(grade+1,12),tz=s.time_zone||'ET',flags=[];\n    // Determine active course for this session\n    const activeCourse=[s.session1_course,s.session2_course,s.session3_course][activeSession-1]||s.active_course||s.session1_course;\n    if(isAO(tz)){const ao=getC('AO');if(counts['AO']<ao.capacity)counts['AO']++;else flags.push({type:'hard',msg:'A&O cohort at capacity'});const pl=mkPl(s,'AO','ao',ng,tz,100,flags,activeCourse);placements.push(pl);if(flags.length)conflicts.push({...pl,options:[]});return;}\n    const cg=getCG(activeCourse);\n    let group=cg;\n    if(!group){const fb=ng>=12?'art':ng===11?'econ':'envi';group=fb;flags.push({type:'warn',msg:'Session '+activeSession+' course blank or unrecognised (\"'+activeCourse+'\") — defaulted to '+fb+' by grade'});}\n    const typical={art:ng>=11,econ:ng>=10&&ng<=12,envi:ng<=11};\n    if(cg&&!typical[cg])flags.push({type:'note',msg:'Grade '+ng+' in '+cg+' group per session course — grade mismatch noted'});\n    const bands=getBands(tz);\n    const blockedBands=getBandConflicts(s);\n    if(blockedBands.size>0){\n      const blNames=[...blockedBands].join(', ');\n      flags.push({type:'warn',msg:'Math/AP conflict blocks bands: '+blNames});\n    }\n    let cands=COHORTS.filter(c=>!c.unassigned&&!c.ao&&c.group===group);\n    if(!cands.length){flags.push({type:'hard',msg:'No active cohorts in '+group+' group'});cands=COHORTS.filter(c=>!c.unassigned&&!c.ao);}\n    // First try: tz band match AND no math/AP conflict\n    let pool=cands.filter(c=>bands.includes(c.tzBand)&&!blockedBands.has(c.tzBand));\n    // Fall back: tz band match ignoring class conflicts\n    if(!pool.length){pool=cands.filter(c=>bands.includes(c.tzBand));if(blockedBands.size>0)flags.push({type:'warn',msg:'No cohort satisfies both timezone and math/AP — timezone prioritised'});}\n    // Fall back: anything in the group\n    if(!pool.length){pool=cands;flags.push({type:'warn',msg:'No timezone-compatible cohort in '+group+' group'});}\n    if(isEU(tz)&&pool.length&&!pool.some(c=>c.tzBand==='morning-EST'))flags.push({type:'warn',msg:'No morning ET slot for European learner in '+group+' group'});\n    const avail=pool.filter(c=>counts[c.id]<c.capacity);\n    if(!avail.length)flags.push({type:'hard',msg:'All '+group+' cohorts at capacity'});\n    const scored=(avail.length?avail:pool).map(c=>({cohort:c.id,score:scoreOneCohort(s,c,bands,placements,blockedBands),theme:c.theme,coach:c.coach,standup:c.standup})).sort((a,b)=>b.score-a.score);\n    const best=scored[0];\n    const assigned=best?best.cohort:COHORTS.find(c=>!c.unassigned&&!c.ao&&c.group===group)?.id||COHORTS.find(c=>!c.unassigned&&!c.ao).id;\n    if(counts[assigned]!==undefined)counts[assigned]++;\n    const asgC=getC(assigned);\n    if(s.previous_mentor_coach&&asgC&&asgC.coach!==s.previous_mentor_coach&&!asgC.coach.includes('TBD')&&!asgC.coach.includes('New'))flags.push({type:'warn',msg:'Coach change: '+s.previous_mentor_coach+' → '+asgC.coach});\n    const pl=mkPl(s,assigned,group,ng,tz,best?best.score:50,flags,activeCourse);\n    placements.push(pl);if(flags.length)conflicts.push({...pl,options:scored.slice(0,3)});\n  });\n  renderConflicts();renderResultsTable();updateResultsStats();updateCBadge();showSec('conflicts');\n}\n\nfunction mkPl(s,cohort,group,grade,tz,score,flags,course){\n  const mathCls=resolveClass(s.math_class,mathClasses);\n  const apCls=resolveClass(s.ap_course,apClasses);\n  return{student_id:s.student_id,name:s.first_name+' '+s.last_name,preferred:s.preferred_name||s.first_name,grade,cohort,group,tz,score,flags,status:flags.some(f=>f.type==='hard')?'conflict':flags.length?'conflict':'placed',manual:false,note:'',session:activeSession,course:course||'',math_class:s.math_class||'',ap_course:s.ap_course||'',math_label:mathCls?mathCls.name:s.math_class||'',ap_label:apCls?apCls.name:s.ap_course||''};\n}\nfunction updateCBadge(){const b=document.getElementById('conflict-badge');if(conflicts.length){b.textContent=conflicts.length;b.style.display='inline';}else b.style.display='none';}\n\n// ── CONFLICTS ──────────────────────────────────────────────────────────────────\nfunction renderConflicts(){\n  const el=document.getElementById('conflict-list');\n  if(!conflicts.length){el.innerHTML='<div class=\"sb\">No conflicts — all students placed cleanly.<\u002Fdiv>';return;}\n  el.innerHTML=conflicts.map((c,ci)=>`<div class=\"cc\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;\">\n      <div><strong>${c.name}<\u002Fstrong>${c.preferred!==c.name.split(' ')[0]?` <span style=\"font-size:11px;color:var(--text-muted);\">(${c.preferred})<\u002Fspan>`:''}<span class=\"sess-indicator s${c.session}\" style=\"margin-left:8px;font-size:10px;\">S${c.session}<\u002Fspan> <span style=\"font-size:12px;color:var(--text-muted);\">Grade ${c.grade} · ${c.tz} · ${gLabel(c.group)}${c.math_label?' · Math: '+c.math_label:''}${c.ap_label?' · AP: '+c.ap_label:''}<\u002Fspan><\u002Fdiv>\n      <span class=\"badge ${c.flags.some(f=>f.type==='hard')?'br':c.flags.some(f=>f.type==='note')?'bp2':'ba'}\">${c.flags.some(f=>f.type==='hard')?'Hard conflict':c.flags.some(f=>f.type==='note')?'Note':'Soft conflict'}<\u002Fspan>\n    <\u002Fdiv>\n    ${c.flags.map(f=>`<div class=\"cf ${f.type==='hard'?'hard':f.type==='note'?'note':''}\">${f.msg}<\u002Fdiv>`).join('')}\n    ${c.options.length?`<div style=\"font-size:12px;color:var(--text-muted);margin:10px 0 6px;\">Options within ${gLabel(c.group)} group:<\u002Fdiv><div style=\"display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;\">${c.options.map(o=>`<div class=\"oc\" id=\"opt-${ci}-${o.cohort}\" onclick=\"selConflict(${ci},'${o.cohort}')\"><div style=\"font-weight:600;color:var(--ink);\">Cohort ${o.cohort}<\u002Fdiv><div style=\"font-size:11px;color:var(--text-muted);\">${o.standup}<\u002Fdiv><div style=\"font-size:11px;color:var(--text-muted);\">Coach: ${o.coach}<\u002Fdiv><div class=\"pw\" style=\"margin-top:6px;\"><div class=\"pf\" style=\"width:${o.score}%;background:${gColor(c.group)};\"><\u002Fdiv><\u002Fdiv><div style=\"font-size:10px;color:var(--text-muted);margin-top:2px;\">${o.score}/100<\u002Fdiv><\u002Fdiv>`).join('')}<\u002Fdiv>`:''}\n    <label style=\"margin-top:12px;display:block;\">Override note <span style=\"color:var(--muted);font-weight:400;\">(required)<\u002Fspan><\u002Flabel>\n    <textarea id=\"note-${ci}\" style=\"min-height:56px;margin-bottom:8px;\" placeholder=\"Reason for placement decision…\"><\u002Ftextarea>\n    <div style=\"display:flex;gap:8px;\"><button class=\"bsm bp\" onclick=\"resolveConflict(${ci})\">Confirm<\u002Fbutton><button class=\"bsm\" onclick=\"keepPlacement(${ci})\">Keep current<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>`).join('');\n}\nfunction selConflict(ci,id){conflicts[ci]._sel=id;document.querySelectorAll(`[id^=\"opt-${ci}-\"]`).forEach(el=>el.classList.toggle('selected',el.id===`opt-${ci}-${id}`));}\nfunction resolveConflict(ci){const note=document.getElementById('note-'+ci).value.trim();if(!note){alert('Please add an override note.');return;}const c=conflicts[ci],nc=c._sel||c.cohort;const idx=placements.findIndex(p=>p.student_id===c.student_id);if(idx>-1)Object.assign(placements[idx],{cohort:nc,status:'placed',note,flags:[]});conflicts.splice(ci,1);renderConflicts();renderResultsTable();updateResultsStats();updateCBadge();}\nfunction keepPlacement(ci){const note=document.getElementById('note-'+ci).value.trim();const idx=placements.findIndex(p=>p.student_id===conflicts[ci].student_id);if(idx>-1){placements[idx].status='placed';placements[idx].note=note||'Kept original';}conflicts.splice(ci,1);renderConflicts();renderResultsTable();updateResultsStats();updateCBadge();}\n\n// ── RESULTS ────────────────────────────────────────────────────────────────────\nfunction updateResultsStats(){\n  const tot=placements.length,pl=placements.filter(p=>p.status==='placed').length,cn=placements.filter(p=>p.status==='conflict').length,mn=placements.filter(p=>p.manual).length;\n  document.getElementById('results-stats').innerHTML=`<div class=\"sc\"><div style=\"font-size:11px;color:var(--text-muted);\">Total<\u002Fdiv><div style=\"font-size:26px;font-weight:600;\">${tot}<\u002Fdiv><\u002Fdiv><div class=\"sc\"><div style=\"font-size:11px;color:var(--text-muted);\">Placed<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:var(--ink);\">${pl}<\u002Fdiv><\u002Fdiv><div class=\"sc\"><div style=\"font-size:11px;color:var(--text-muted);\">Conflicts<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:var(--ink);\">${cn}<\u002Fdiv><\u002Fdiv><div class=\"sc\"><div style=\"font-size:11px;color:var(--text-muted);\">Manual<\u002Fdiv><div style=\"font-size:26px;font-weight:600;color:var(--ink);\">${mn}<\u002Fdiv><\u002Fdiv>`;\n  const sel=document.getElementById('filter-cohort');if(sel.options.length<=1){[...new Set(placements.map(p=>p.cohort))].sort().forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=id==='AO'?'A&O':'Cohort '+id;sel.appendChild(o);});}\n}\nfunction filterResults(){renderResultsTable();}\nfunction renderResultsTable(){\n  const q=(document.getElementById('search-q').value||'').toLowerCase(),cf=document.getElementById('filter-cohort').value,gf=document.getElementById('filter-group').value,sf=document.getElementById('filter-status').value;\n  const f=placements.filter(p=>{if(q&&!p.name.toLowerCase().includes(q)&&!p.student_id.toLowerCase().includes(q)&&!(p.preferred||'').toLowerCase().includes(q))return false;if(cf&&p.cohort!==cf)return false;if(gf&&p.group!==gf)return false;if(sf&&p.status!==sf)return false;return true;});\n  const tb=document.getElementById('results-tbody');\n  if(!placements.length){tb.innerHTML='<tr><td colspan=\"13\" class=\"es\">Run the placement engine to see results.<\u002Ftd><\u002Ftr>';return;}\n  if(!f.length){tb.innerHTML='<tr><td colspan=\"13\" class=\"es\">No students match your filters.<\u002Ftd><\u002Ftr>';return;}\n  tb.innerHTML=f.map(p=>{const c=getC(p.cohort)||{};const sb=p.status==='placed'?'bt':p.status==='manual'?'bp2':'ba';const hn=p.flags&&p.flags.some(x=>x.type==='note');\n    const peerIds=getPeerIds(p.student_id);const metPeers=peerIds.filter(pid=>placements.find(pp=>pp.cohort===p.cohort&&pp.student_id===pid)).map(pid=>students.find(s=>s.student_id===pid)?.preferred_name).filter(Boolean);\n    return`<tr class=\"${hn?'rn':''}\"><td><strong>${p.name}<\u002Fstrong>${p.preferred&&p.preferred!==p.name.split(' ')[0]?` <span style=\"font-size:11px;color:var(--text-muted);\">(${p.preferred})<\u002Fspan>`:''}<br><span style=\"font-size:11px;color:var(--text-muted);\">${p.student_id}<\u002Fspan>${metPeers.length?'<br><span style=\"font-size:10px;color:var(--muted);\">&#10003; with '+metPeers.join(', ')+'<\u002Fspan>':''}${p.note?'<div style=\"font-size:11px;color:var(--text-muted);font-style:italic;\">'+p.note+'<\u002Fdiv>':''}<\u002Ftd><td>${p.grade}<\u002Ftd><td><span class=\"sess-indicator s${p.session}\" style=\"font-size:10px;padding:2px 6px;\">S${p.session}<\u002Fspan><\u002Ftd><td><span class=\"badge ${gBadge(p.group)}\">${gLabel(p.group)}<\u002Fspan><\u002Ftd><td style=\"font-weight:600;color:var(--ink);\">${p.cohort==='AO'?'A&O':'Cohort '+p.cohort}<\u002Ftd><td>${p.tz}<\u002Ftd><td style=\"font-size:12px;\">${c.coach||'—'}<\u002Ftd><td style=\"font-size:12px;white-space:nowrap;\">${c.standup||'—'}<\u002Ftd><td style=\"font-size:12px;\">${p.math_label||'—'}<\u002Ftd><td style=\"font-size:12px;\">${p.ap_label||'—'}<\u002Ftd><td><span class=\"badge ${sb}\">${p.status}<\u002Fspan><\u002Ftd><td style=\"font-size:12px;\">${p.score}<\u002Ftd><td><button class=\"bsm\" onclick=\"editPlacement('${p.student_id}')\">Edit<\u002Fbutton><\u002Ftd><\u002Ftr>`;\n  }).join('');\n}\nfunction editPlacement(id){const p=placements.find(x=>x.student_id===id);if(!p)return;const valid=COHORTS.filter(c=>!c.unassigned).map(c=>c.id).join(', ');const nc=prompt(`Reassign ${p.name}\\nValid: ${valid}\\nCurrent: ${p.cohort}`,p.cohort);if(!nc||nc.toUpperCase()===p.cohort)return;if(!COHORTS.find(c=>c.id===nc.toUpperCase())){alert('Invalid cohort');return;}const note=prompt('Override note (required):');if(!note)return;const ng=getC(nc.toUpperCase())?.group||p.group;Object.assign(p,{cohort:nc.toUpperCase(),group:ng,note,status:'placed',manual:true});renderResultsTable();updateResultsStats();}\n\n// ── MANUAL ──────────────────────────────────────────────────────────────────────\nfunction runManual(){\n  const fn=document.getElementById('m-fn').value.trim(),ln=document.getElementById('m-ln').value.trim(),grade=parseInt(document.getElementById('m-gr').value)||0,tz=document.getElementById('m-tz').value,s1=document.getElementById('m-s1').value,mathId=document.getElementById('m-math').value,apId=document.getElementById('m-ap').value,prev=document.getElementById('m-prev').value.trim().toUpperCase(),pc=document.getElementById('m-coach').value.trim();\n  if(!fn||!grade||!tz){alert('Fill in name, grade, and time zone.');return;}\n  const ng=Math.min(grade+1,12);document.getElementById('manual-results').style.display='block';\n  const sFake={student_id:'manual',math_class:mathClasses.find(c=>c.id===mathId)?.name||'',ap_course:apClasses.find(c=>c.id===apId)?.name||''};\n  const blockedBands=getBandConflicts(sFake);\n  if(isAO(tz)){const ao=getC('AO'),n=cohortCount('AO');document.getElementById('manual-options').innerHTML=`<div class=\"ro selected\"><div class=\"rf\" style=\"justify-content:space-between;\"><span style=\"font-size:16px;font-weight:600;color:var(--ink);\">A&O cohort <span class=\"badge bt\">Auto-routed<\u002Fspan><\u002Fspan><span style=\"font-size:12px;color:var(--text-muted);\">${n}/${ao.capacity}<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:var(--text-muted);margin-top:4px;\">${ao.standup} · Coach: ${ao.coach}<\u002Fdiv><\u002Fdiv>`;selectedManual={student:{student_id:'PS-M'+(Date.now()%10000),first_name:fn,last_name:ln,grade_level:String(grade),time_zone:tz},options:[{cohort:'AO',group:'ao',score:100,coach:ao.coach,standup:ao.standup,fill:n+'/'+ao.capacity,flags:[]}],_i:0};return;}\n  const group=s1||(ng>=12?'art':ng===11?'econ':'envi');const bands=getBands(tz);\n  let cands=COHORTS.filter(c=>!c.unassigned&&!c.ao&&c.group===group);if(!cands.length)cands=COHORTS.filter(c=>!c.unassigned&&!c.ao);\n  const scored=cands.map(c=>{const n=cohortCount(c.id);if(n>=c.capacity)return null;const flags=[];let sc=50;\n    if(!blockedBands.has(c.tzBand))sc+=30;else flags.push('Math/AP conflict with this band');\n    const bi=bands.indexOf(c.tzBand);if(bi===0)sc+=20;else if(bi===1)sc+=10;else if(bi===2)sc+=5;else flags.push('Timezone may not align');\n    if(prev&&c.id===prev)sc+=7;if(pc&&c.coach===pc)sc+=8;\n    return{cohort:c.id,group:c.group,score:Math.min(Math.round(sc),100),flags,theme:c.theme,coach:c.coach,standup:c.standup,fill:n+'/'+c.capacity};}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,4);\n  if(!scored.length){document.getElementById('manual-options').innerHTML='<div class=\"wb\">No available cohorts.<\u002Fdiv>';selectedManual=null;return;}\n  document.getElementById('manual-options').innerHTML=scored.map((o,i)=>`<div class=\"ro ${i===0?'selected':''}\" id=\"mopt-${i}\" onclick=\"selManual(${i})\"><div class=\"rf\" style=\"justify-content:space-between;\"><span style=\"font-size:16px;font-weight:600;color:var(--ink);\">Cohort ${o.cohort} ${i===0?'<span class=\"badge bp2\">Best<\u002Fspan>':''}<\u002Fspan><span style=\"font-size:12px;color:var(--text-muted);\">${o.fill}<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:var(--text-muted);\">${o.standup} · Coach: ${o.coach}<\u002Fdiv><div class=\"pw\" style=\"margin-top:8px;\"><div
